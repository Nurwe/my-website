<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CV | Nicolas Aragona</title>
  <link rel="stylesheet" href="../styles.css">
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a class="logo" href="/">Economics Portfolio</a>
      <nav class="site-nav" aria-label="Primary navigation">
        <a href="/">Home</a>
        <a href="/#writings">Writings</a>
        <a href="/#cv">CV</a>
        <a href="/#contact">Contact</a>
      </nav>
    </div>
  </header>

  <main>
    <section class="section">
      <div class="container">
        <div class="section-heading">
          <p class="section-label">CV & Documents</p>
          <h2>Education, experience, and qualifications.</h2>
        </div>
        
        <div style="display: grid; gap: 2rem; margin-top: 2rem;">
          <article style="border: 1px solid var(--border); padding: 2rem; border-radius: var(--radius); background: var(--surface);">
            <h3>CV.pdf</h3>
            <p style="color: var(--muted); margin: 0.5rem 0;">Complete curriculum vitae</p>
            <a class="button primary" href="CV.pdf" download style="display: inline-block; margin-top: 1rem;">Download PDF</a>
          </article>
        </div>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container footer-inner">
      <p>© 2026 Nicolas Aragona · Economics Portfolio</p>
      <p>Built with a simple responsive design for writing and reflection.</p>
    </div>
  </footer>
</body>
</html>
